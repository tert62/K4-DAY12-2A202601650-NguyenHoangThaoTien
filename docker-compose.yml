# ═══════════════════════════════════════════════════════════════════
# CP2 — Stack chạy ở máy bạn: chat + redis (+ nginx nếu làm phần cộng điểm)
#
# Service `redis` đã cho sẵn — chạy ngay từ Block 1 để có Redis mà code:
#     docker compose up -d redis
#
# NHIỆM VỤ: bổ sung service `chat`. Yêu cầu:
#   [ ] build từ Dockerfile trong thư mục hiện tại
#   [ ] map cổng ra ngoài (8000:8000)
#   [ ] KHÔNG viết secret thẳng vào file này — dùng nội suy biến môi trường
#       `${API_TOKEN}` (docker compose tự đọc từ file .env cùng thư mục)
#   [ ] REDIS_URL trỏ tới `redis://redis:6379/0` — trong compose, tên service
#       chính là hostname
#   [ ] depends_on: redis
#   [ ] healthcheck gọi /healthz
#
# ĐIỂM CỘNG: thêm service `nginx` làm load balancer (nginx/nginx.conf đã có sẵn)
#     docker compose up --scale chat=3
#
# Kiểm tra: pytest tests/test_cp2.py -v
# ═══════════════════════════════════════════════════════════════════

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  chat:
    build: .
    ports:
      # Mặc định 8000:8000. Đặt CHAT_HOST_PORT trong .env nếu cổng 8000 của
      # máy đang bị một project khác chiếm.
      - "${CHAT_HOST_PORT:-8000}:8000"
    environment:
      # Nội suy từ file .env cùng thư mục — KHÔNG viết giá trị secret vào đây
      API_TOKEN: ${API_TOKEN}
      # Trong compose, tên service chính là hostname. `localhost` bên trong
      # container là chính container đó, không phải Redis.
      REDIS_URL: redis://redis:6379/0
      PORT: 8000
      BUCKET_CAPACITY: ${BUCKET_CAPACITY:-10}
      REFILL_PER_MINUTE: ${REFILL_PER_MINUTE:-10}
      DAILY_BUDGET_USD: ${DAILY_BUDGET_USD:-1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          sys.exit(0 if urllib.request.urlopen("http://127.0.0.1:8000/healthz", timeout=3).status == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Cho uvicorn kịp xử lý nốt request đang chạy sau khi nhận SIGTERM
    stop_grace_period: 30s
    restart: unless-stopped

  # ĐIỂM CỘNG — load balancer đứng trước nhiều instance `chat`.
  # Chỉ chạy khi gọi tên profile, để `docker compose up -d` mặc định vẫn gọn:
  #     docker compose --profile lb up -d --scale chat=3
  # (nhớ bỏ mục `ports` của service `chat` khi scale, 3 container không thể
  #  cùng chiếm cổng 8000 của host)
  nginx:
    image: nginx:1.27-alpine
    profiles: ["lb"]
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chat

volumes:
  redis-data:
